/* ADAPT authoring guide: five expandable steps, with the seven dimensions inside. */
.guide-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0 0 8px}
.guide-actions .btn{padding:10px 16px;font-size:13px}
.guide-start-note{max-width:760px;margin:6px auto 16px;text-align:center;font-size:12px;color:var(--muted)}
.guide-status{font-size:12px;color:var(--accent);margin:5px 0 0;min-height:0}
.guide-status:empty{display:none}
#guideStatus{text-align:center;margin:8px 0 12px}
.guide-steps{display:grid;gap:10px;margin-top:17px}
.guide-step{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.guide-step>summary{display:flex;align-items:center;gap:15px;list-style:none;cursor:pointer;padding:17px 20px}
.guide-step>summary::-webkit-details-marker{display:none}
.guide-step>summary:hover{background:#f7fbf9}
.guide-step[open]>summary{background:var(--accent2);border-bottom:1px solid #d4e9e4}
.guide-letter{width:42px;height:42px;background:var(--accent);border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;font-size:25px;font-weight:800}
.guide-summary-text{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.guide-summary-text>strong{font-size:17px;font-weight:720;line-height:1.25}
.guide-gloss{font-size:12px;color:var(--accent);font-weight:650}

 Sie die ganzzahligen Grenzen unter den optionalen Einstellungen.","generated":"Aus Ihren Angaben erzeugt. Prüfen und testen Sie den Prompt in Ihrem freigegebenen KI-Werkzeug.","copied":"Kopiert. Hängen Sie referenzierte Dateien separat im KI-Werkzeug an.","selected":"Text markiert. Drücken Sie Ctrl+C / Command+C.","saved":"Prompt-Datei vorbereitet. Inhalte referenzierter Dateien sind nicht enthalten.","confirmClear":"Alle Felder leeren?","appendTitle":"Diesen Vorschlag übernehmen?","appendText":"Dieses Feld enthält bereits Text.","append":"Anhängen","replace":"Ersetzen","cancel":"Abbrechen","learningSummary":"Zusammenfassung des Lerndesigns","sumGoal":"Lernziel","sumLearner":"Bei den Lernenden bleibt","sumHelp":"Die KI darf helfen durch","sumEvidence":"Lernnachweis","manualHint":"Manuelle Testvorschläge für Ihr gewähltes KI-Werkzeug. Diese Seite führt die Tests nicht aus.","testMis":"Mögliche Fehlvorstellung","testMisD":"Prüft der Assistent die zugrunde liegende Idee, nutzt nur erlaubte Hilfe und überprüft anschließend erneut, ohne die lernende Person zu etikettieren?","testDo":"„Mach es einfach für mich“","testDoD":"Schützt er die Ziel-Eigenleistung, ohne jede hilfreiche Unterstützung zu verweigern?","testCtx":"Fehlender oder aufgabenspezifischer Kontext","testCtxD":"Nutzt er den bereitgestellten Kontext und fragt bei fehlenden Informationen nach, statt Details zu erfinden?","testStop":"Anhaltende Schwierigkeiten oder „Stopp“","testStopD":"Beendet oder übergibt er gemäß den festgelegten Grenzen?","testFinal":"Abschließender Lernnachweis","testFinalYes":"Verzichtet er auf inhaltliche Hinweise und unterscheidet unterstützte von unabhängiger Leistung?","testFinalNo":"Vermeidet er Aussagen über selbstständige Beherrschung ohne unabhängigen Check?","featureCount":"Enthalten in","featureDefinition":"Was wurde gezählt","designDecision":"Bedeutung für die Gestaltung","sourceEvidence":"Quellennachweise","originalExcerpt":"Originaler Quellenausschnitt","source":"Quelle","notes":"Hinweis","noneFound":"Nach dieser Definition nicht ausdrücklich festgelegt.","close":"Schließen","allExamples":"Acht Partnerbeispiele","roleLabel":"Rolle","originalWording":"Quellenausschnitte werden im ursprünglichen Wortlaut angezeigt.","mapTitle":"Synthese von Merkmalen zu ADAPT","map1":"F2 (Lerngruppe) informiert hauptsächlich den Lernenden-/Kontextteil von Zielgruppe und Ziel.","map2":"F3 (Bildungszweck) und F10 (Erfolgskriterien / Rubrik) informieren hauptsächlich Ziele und Erfolgsnachweise.","map3":"F1 (KI-Rolle) und F5 (Grenzen der KI-Hilfe) informieren hauptsächlich Rollen und Verantwortlichkeiten definieren.","map4":"F4 (Aktiver Lernendenbeitrag), F7 (Eine Frage oder ein Schritt zugleich) und F13 (Absichtliche KI-Fehler) informieren hauptsächlich Lernaktivität und Interaktion.","map5":"F6 (Adaptive oder progressive Unterstützung) und F9 (Benannte Schwierigkeitsstufen) informieren hauptsächlich die Anpassung.","map6":"F8 (Tatsächlich bereitgestellter Aufgabenpool) und F14 (Regel für fehlende Information / Unsicherheit) informieren hauptsächlich Kontext und Materialien bereitstellen.","map7":"F11 (Auslöser für den Abschluss), F12 (Explizite Lernreflexion) und F16 (Unabhängiger Abschlusscheck) informieren hauptsächlich Abschluss und Transfer.","footer":"ADAPT-AI · WP3 Educational Prompting Structure","exampleHeading":"Inspiration gesucht? Probieren Sie ein vollständiges Beispiel.","exampleHint":"Jedes Beispiel füllt alle fünf ADAPT-Schritte. Anschließend können Sie jedes Feld bearbeiten.","loadExample":"Beispiel laden","confirmExample":"Den aktuellen Formularinhalt durch dieses Beispiel ersetzen?","exampleLoaded":"Beispiel geladen. Vor dem Erstellen des Prompts können Sie alles anpassen.","derivedFrom":"Vor allem abgeleitet aus","mappingNote":"Dies ist eine Synthese und keine Eins-zu-eins-Codierung. Zur besseren Übersicht wird jedes Merkmal an einer Hauptstelle gezeigt; verwandte Ideen können dennoch mehrere ADAPT-Schritte berühren. F15 (Datenminimierung) ist eine übergreifende Schutzmaßnahme.","stillStuck":"Wenn Lernende trotz Unterstützung nicht weiterkommen:","stillStuckText":"Die Unterstützungsstrategie ändern; nur die laut Hilferegel erlaubte Erklärung geben oder pausieren und Unterstützung durch die Lehrkraft vorschlagen."}},"ADAPT_TXT":{"en":[["A","Audience & Aim","Who is learning, and what should they learn?","Detailed dimensions 1–2"],["D","Define roles & responsibilities","What should the AI do, and what must remain with the learner?","Detailed dimension 3"],["A","Activity & Adaptation","What will learners do, and how should support change?","Detailed dimensions 4–5"],["P","Provide context & materials","What additional information should the AI know or use?","Detailed dimension 6"],["T","Termination & Transfer","When should the activity end, and what should the learner demonstrate?","Detailed dimension 7 + final learning check"]],"sl":[["A","Audience & Aim","Kdo se uči in kaj naj se nauči?","Podrobni dimenziji 1–2"],["D","Define roles & responsibilities","Kaj naj dela AI in kaj mora ostati delo učenca?","Podrobna dimenzija 3"],["A","Activity & Adaptation","Kaj bo učenec delal in kako naj se podpora prilagaja?","Podrobni dimenziji 4–5"],["P","Provide context & materials","Katere dodatne informacije mora AI poznati ali uporabiti?","Podrobna dimenzija 6"],["T","Termination & Transfer","Kdaj naj se aktivnost konča in kaj mora učenec pokazati?","Podrobna dimenzija 7 + zaključno preverjanje"]],"de":[["A","Audience & Aim","Wer lernt und was sollen die Lernenden lernen?","Detaildimensionen 1–2"],["D","Define roles & responsibilities","Was soll die KI tun und was muss bei den Lernenden bleiben?","Detaildimension 3"],["A","Activity & Adaptation","Was tun die Lernenden und wie soll sich die Unterstützung anpassen?","Detaildimensionen 4–5"],["P","Provide context & materials","Welche zusätzlichen Informationen soll die KI kennen oder nutzen?","Detaildimension 6"],["T","Termination & Transfer","Wann soll die Aktivität enden und was sollen die Lernenden zeigen?","Detaildimension 7 + abschließender Lerncheck"]]},"DIM_TXT":{"en":[["Learners & context","Who is learning, and in what setting?","subject/topic, learner group, relevant prior knowledge and, when useful, the learning setting, language or access needs.","the same content may require different language, examples and support for different learners. Age or grade alone should not be treated as a complete learner profile.","Grade 7 learners of English who can write simple sentences but still need support organising a short opinion paragraph."],["Goals & learning evidence","What should learners learn, and what would show it?","the learning objective and concrete success criteria. The activity should elicit evidence linked to those criteria.","completing a chat or producing a correct answer is not automatically evidence of learning. Where appropriate, include a fresh explanation, application or transfer task.","In mathematics, the learner can distinguish area from perimeter, choose the correct measure for a situation, explain the choice and apply it to a fresh rectangle problem."],["Roles & responsibilities","What should the AI do, and what must remain with the learner?","the AI role, the learner’s responsibility and any work the AI must not take over.","a tutor, teachable peer, critical friend and role-play character support learning differently. The role should define behaviour, not only a persona.","In history, the AI acts as a critical friend; the learner evaluates the source, while the AI may challenge the reasoning but must not write the final source evaluation."],["Learning activity & interaction","What will learners do, and how should the interaction work?","what the learner actually does — explain, solve, teach, justify, critique, revise or create — and how questions, hints and feedback should be used.","the AI role alone does not define the learning activity. Interaction rules should keep the learner cognitively active and make the intended contribution visible.","In science, the learner explains why seasons occur, the AI asks one focused follow-up question, then tests the explanation with a new situation."],["Adaptation rules","What should change when learners struggle or are ready to progress?","how support should change in response to observable learner work — for example, stronger hints, a similar task, reduced support, a transfer task or teacher handoff.","replace vague instructions such as “adapt to the learner” with bounded responses that can be reviewed and tested.","If a pupil treats area and perimeter as the same quantity, compare two rectangles with the same area but different perimeters, ask what changed, then recheck the idea.","when a response suggests a possible misconception, the AI should test the idea with a focused question, example or counterexample before treating it as confirmed."],["Additional context & materials","What does the AI need to know that may not be reliably known already?","when relevant: local or course-specific information, definitions, task rules, datasets, examples, source text or referenced files.","a general AI may otherwise make a plausible but wrong assumption about the lesson sequence, notation, source text, rubric or classroom convention.","In an English lesson, the class uses a specific paragraph structure and an 80–100 word limit; the AI should follow those local rules rather than assume a different writing framework."],["Completion & outputs","When should the activity stop, and how should it finish?","the stopping condition, final learning check and desired closing output, such as reflection, feedback, summary or a next step.","finishing the planned activity is different from demonstrating understanding. Where appropriate, distinguish assisted performance from an independent final attempt.","Finish after the learner completes one fresh task without content hints; then summarise what was demonstrated and what still needs practice."]],"sl":[["Učenci in kontekst","Kdo se uči in v kakšnem okolju?","predmet/temo, skupino učencev, relevantno predznanje ter po potrebi učno okolje, jezik ali potrebe glede dostopnosti.","ista vsebina lahko za različne učence zahteva drugačen jezik, primere in podporo. Starost ali razred sama po sebi nista popoln opis učenca.","Učenci 7. razreda pri angleščini, ki znajo pisati preproste povedi, vendar še potrebujejo podporo pri organizaciji kratkega mnenjskega odstavka."],["Cilji in dokazi učenja","Kaj naj se učenci naučijo in kaj bi to pokazalo?","učni cilj in konkretne kriterije uspeha. Aktivnost naj pridobi dokaze, povezane s temi kriteriji.","zaključen pogovor ali pravilen odgovor sam po sebi še ne dokazuje učenja. Kadar je smiselno, vključite nov primer, razlago, uporabo ali prenos.","Pri matematiki učenec razlikuje med ploščino in obsegom, izbere pravilno količino za dano situacijo, izbiro pojasni in znanje uporabi pri novem primeru pravokotnika."],["Vloge in odgovornosti","Kaj naj dela AI in kaj mora ostati delo učenca?","vlogo AI, odgovornost učenca in delo, ki ga AI ne sme prevzeti.","tutor, učljivi vrstnik, kritični prijatelj ali lik v scenariju podpirajo učenje na različne načine. Vloga naj opiše vedenje, ne le osebnosti.","Pri zgodovini AI deluje kot kritični prijatelj; učenec sam ovrednoti vir, AI pa lahko izzove njegovo utemeljitev, ne sme pa napisati končne presoje namesto njega."],["Učna aktivnost in interakcija","Kaj bodo učenci delali in kako naj poteka interakcija?","kaj učenec dejansko počne — razlaga, rešuje, poučuje, utemeljuje, kritizira, popravlja ali ustvarja — ter kako se uporabljajo vprašanja, namigi in povratne informacije.","sama vloga AI še ne določi učne aktivnosti. Pravila interakcije naj učenca ohranjajo miselno aktivnega in naredijo njegov prispevek viden.","Pri naravoslovju učenec razloži nastanek letnih časov, AI postavi eno ciljno podvprašanje in nato razlago preveri z novo situacijo."],["Pravila prilagajanja","Kaj naj se spremeni, ko ima učenec težave ali je pripravljen napredovati?","kako naj se podpora spreminja glede na opazno učenčevo delo — npr. močnejši namig, podobna naloga, manj podpore, naloga za prenos ali predaja učitelju.","nejasno navodilo »prilagajaj se učencu« nadomestimo z omejenimi odzivi, ki jih lahko pregledamo in preizkusimo.","Če učenec zamenjuje ploščino in obseg, primerjaj dva pravokotnika z enako ploščino in različnim obsegom, vprašaj kaj se je spremenilo in nato ponovno preveri razumevanje.","če odgovor nakazuje možno napačno predstavo, naj AI idejo najprej preveri s ciljnim vprašanjem, primerom ali protiprimerom, preden jo obravnava kot potrjeno."],["Dodatni kontekst in gradiva","Kaj mora AI še vedeti, česar morda ne pozna zanesljivo?","kadar je relevantno: lokalne ali predmetno specifične informacije, definicije, pravila naloge, podatke, primere, besedilo vira ali referenčne datoteke.","splošni AI bi sicer lahko naredil verjetno, a napačno predpostavko o zaporedju učne ure, zapisu, besedilu, rubriki ali razrednem dogovoru.","Pri angleščini razred uporablja določeno strukturo odstavka in omejitev 80–100 besed; AI naj sledi tem lokalnim pravilom, ne drugi pisni shemi."],["Zaključek in izhodi","Kdaj naj se aktivnost konča in kako naj se zaključi?","pogoj za zaključek, končno preverjanje učenja in želeni zaključni izhod, npr. refleksijo, povratno informacijo, povzetek ali naslednji korak.","zaključek načrtovane aktivnosti ni isto kot dokaz razumevanja. Kadar je smiselno, ločite delo s pomočjo od samostojnega zaključnega poskusa.","Zaključi, ko učenec eno novo nalogo opravi brez vsebinskih namigov; nato na kratko povzemite, kaj je pokazal in kaj potrebuje še vaje."]],"de":[["Lernende & Kontext","Wer lernt und in welchem Setting?","Fach/Thema, Lerngruppe, relevantes Vorwissen und bei Bedarf Lernsetting, Sprache oder Zugangsbedürfnisse.","derselbe Inhalt kann für unterschiedliche Lernende andere Sprache, Beispiele und Unterstützung erfordern. Alter oder Klassenstufe allein sind kein vollständiges Lernendenprofil.","Englischlernende in Klasse 7, die einfache Sätze schreiben können, aber noch Unterstützung beim Aufbau eines kurzen Meinungsabsatzes benötigen."],["Ziele & Lernnachweise","Was sollen die Lernenden lernen und woran wäre das erkennbar?","das Lernziel und konkrete Erfolgskriterien. Die Aktivität soll Nachweise hervorbringen, die mit diesen Kriterien verknüpft sind.","ein beendeter Chat oder eine richtige Antwort ist nicht automatisch ein Lernnachweis. Wo sinnvoll, sollte eine neue Erklärung, Anwendung oder Transferaufgabe folgen.","In Mathematik unterscheiden die Lernenden Fläche und Umfang, wählen die passende Größe für eine Situation, begründen die Wahl und wenden das Verständnis auf ein neues Rechteckproblem an."],["Rollen & Verantwortlichkeiten","Was soll die KI tun und was muss bei den Lernenden bleiben?","die KI-Rolle, die Verantwortung der Lernenden und Arbeiten, die die KI nicht übernehmen darf.","Tutor, lernender Peer, kritischer Freund und Rollenspiel-Charakter unterstützen Lernen unterschiedlich. Die Rolle sollte Verhalten definieren, nicht nur eine Persona.","Im Geschichtsunterricht agiert die KI als kritischer Freund; die Lernenden bewerten die Quelle selbst, während die KI die Begründung hinterfragen darf, aber keine fertige Quellenbewertung schreibt."],["Lernaktivität & Interaktion","Was tun die Lernenden und wie soll die Interaktion ablaufen?","was die Lernenden tatsächlich tun — erklären, lösen, lehren, begründen, kritisieren, überarbeiten oder erstellen — und wie Fragen, Hinweise und Feedback eingesetzt werden.","die KI-Rolle allein definiert noch keine Lernaktivität. Interaktionsregeln sollen die Lernenden kognitiv aktiv halten und ihren beabsichtigten Beitrag sichtbar machen.","Im naturwissenschaftlichen Unterricht erklären die Lernenden die Jahreszeiten, die KI stellt eine gezielte Nachfrage und prüft die Erklärung anschließend an einer neuen Situation."],["Anpassungsregeln","Was soll sich ändern, wenn Lernende Schwierigkeiten haben oder bereit für den nächsten Schritt sind?","wie sich Unterstützung auf Grundlage beobachtbarer Lernendenbeiträge ändern soll — z. B. stärkerer Hinweis, ähnliche Aufgabe, weniger Unterstützung, Transferaufgabe oder Übergabe an die Lehrkraft.","vage Vorgaben wie „an die Lernenden anpassen“ werden durch begrenzte, überprüfbare Reaktionen ersetzt.","Wenn ein Kind Fläche und Umfang gleichsetzt, werden zwei Rechtecke mit gleicher Fläche, aber unterschiedlichem Umfang verglichen; danach wird gezielt nachgefragt und das Verständnis erneut geprüft.","wenn eine Antwort auf eine mögliche Fehlvorstellung hindeutet, soll die KI die Idee zuerst mit einer gezielten Frage, einem Beispiel oder Gegenbeispiel prüfen, bevor sie sie als bestätigt behandelt."],["Zusätzlicher Kontext & Materialien","Was muss die KI wissen, das sie möglicherweise nicht zuverlässig kennt?","wenn relevant: lokale oder kursspezifische Informationen, Definitionen, Aufgabenregeln, Datensätze, Beispiele, Quellentexte oder referenzierte Dateien.","eine allgemeine KI könnte sonst plausible, aber falsche Annahmen über Unterrichtsablauf, Notation, Quellentext, Bewertungsraster oder Klassenkonvention treffen.","Im Englischunterricht nutzt die Klasse eine bestimmte Absatzstruktur und eine Grenze von 80–100 Wörtern; die KI soll diese lokalen Regeln befolgen und kein anderes Schreibschema voraussetzen."],["Abschluss & Outputs","Wann soll die Aktivität enden und wie soll sie abgeschlossen werden?","Abschlussbedingung, abschließenden Lerncheck und gewünschtes Abschlussformat, z. B. Reflexion, Feedback, Zusammenfassung oder nächsten Schritt.","das Ende der geplanten Aktivität ist nicht dasselbe wie ein Lernnachweis. Wo sinnvoll, sollte unterstützte Leistung von einem unabhängigen Abschlussversuch getrennt werden.","Beenden, nachdem die Lernenden eine neue Aufgabe ohne inhaltliche Hinweise bearbeitet haben; anschließend kurz zusammenfassen, was gezeigt wurde und was noch geübt werden sollte."]]},"FEATURE_TXT":{"role":{"en":["AI role","An assigned AI function/persona, or a dedicated role field. Role labels are not mutually exclusive categories.","Keep a role field; let the teacher choose the role."],"sl":["Vloga AI","Dodeljena funkcija/osebnost AI ali namensko polje za vlogo. Oznake vlog se lahko prekrivajo.","Ohranimo polje za vlogo in izbiro prepustimo učitelju."],"de":["KI-Rolle","Eine zugewiesene KI-Funktion/Persona oder ein eigenes Rollenfeld. Rollenbezeichnungen schließen sich nicht gegenseitig aus.","Rollenfeld beibehalten; die Lehrkraft wählt die Rolle."]},"audience":{"en":["Learner group","An explicit human learner group or a dedicated field asking for one.","Use one teacher-controlled learner description."],"sl":["Skupina učencev","Izrecno navedena skupina učencev ali namensko polje, ki jo zahteva.","Uporabimo en opis učencev, ki ga določi učitelj."],"de":["Lerngruppe","Eine ausdrücklich genannte Lerngruppe oder ein eigenes Feld dafür.","Eine von der Lehrkraft kontrollierte Lernendenbeschreibung verwenden."]},"goal":{"en":["Educational purpose","A learner-oriented aim is described or requested.","Separate learning goals from narrative success and output formatting."],"sl":["Izobraževalni namen","Opisan ali zahtevan je cilj, usmerjen v učenje.","Učne cilje ločimo od uspeha scenarija in oblike izhoda."],"de":["Bildungszweck","Ein lernendenorientiertes Ziel wird beschrieben oder abgefragt.","Lernziele von narrativem Erfolg und Ausgabeformat trennen."]},"contribution":{"en":["Active learner contribution","Explaining, deciding, solving, revising or another substantive learner action is requested.","Specify the target learner contribution rather than counting chat turns."],"sl":["Aktiven prispevek učenca","Zahtevano je razlaganje, odločanje, reševanje, popravljanje ali drugo vsebinsko dejanje učenca.","Določimo ciljni prispevek učenca, ne števila izmenjav v pogovoru."],"de":["Aktiver Lernendenbeitrag","Erklären, Entscheiden, Lösen, Überarbeiten oder eine andere substanzielle Aktivität wird verlangt.","Den Zielbeitrag der Lernenden festlegen statt Chatbeiträge zu zählen."]},"help":{"en":["Limits on AI help","An explicit restriction on supplying answers/replacing learner work, or an offered help-policy option.","Protect the target contribution; make the amount and timing of help configurable."],"sl":["Omejitve pomoči AI","Izrecna omejitev podajanja odgovorov oziroma prevzemanja učenčevega dela ali možnost nastavitve politike pomoči.","Zaščitimo ciljni prispevek učenca; količina in čas pomoči naj bosta nastavljiva."],"de":["Grenzen der KI-Hilfe","Explizite Einschränkung für Antworten/Übernahme von Lernendenarbeit oder eine wählbare Hilferegel.","Zielbeitrag schützen; Umfang und Zeitpunkt der Hilfe konfigurierbar machen."]},"adaptation":{"en":["Adaptive or progressive support","Support, difficulty, task selection or feedback is adjusted to learner performance or response.","Ask for observable triggers, permitted support moves and a recheck."],"sl":["Prilagodljiva ali progresivna podpora","Podpora, težavnost, izbor nalog ali povratne informacije se prilagajajo učenčevemu delu ali odgovoru.","Zahtevajmo opazne sprožilce, dovoljene podporne ukrepe in ponovno preverjanje."],"de":["Adaptive oder progressive Unterstützung","Unterstützung, Schwierigkeit, Aufgabenauswahl oder Feedback wird an Lernendenleistung/-antwort angepasst.","Beobachtbare Auslöser, erlaubte Unterstützungsmaßnahmen und erneute Prüfung verlangen."]},"one_step":{"en":["One question or step at a time","Interaction explicitly limits the assistant to one question/task/step before waiting.","Offer this as a useful interaction option, not a universal rule."],"sl":["Eno vprašanje ali korak naenkrat","Interakcija izrecno omeji asistenta na eno vprašanje, nalogo ali korak pred čakanjem na odgovor.","Ponudimo kot koristno možnost, ne kot univerzalno pravilo."],"de":["Eine Frage oder ein Schritt zugleich","Die Interaktion beschränkt den Assistenten ausdrücklich auf eine Frage/Aufgabe/einen Schritt vor dem Warten.","Als nützliche Option anbieten, nicht als universelle Regel."]},"task_bank":{"en":["Actual task bank supplied","A concrete set/pool of tasks is included, not merely a field asking for tasks.","Keep task banks optional and teacher-supplied."],"sl":["Dejansko podana banka nalog","Vključen je konkreten nabor nalog, ne le polje, ki naloge zahteva.","Banka nalog naj ostane neobvezna in učiteljeva."],"de":["Tatsächlich bereitgestellter Aufgabenpool","Ein konkreter Aufgabenpool ist enthalten, nicht nur ein Feld dafür.","Aufgabenpools optional und von der Lehrkraft bereitgestellt halten."]},"levels":{"en":["Labelled difficulty levels","The prompt contains named/numbered difficulty levels rather than general adaptation alone.","Support teacher-defined levels when useful, without making them mandatory."],"sl":["Označene ravni težavnosti","Prompt vsebuje poimenovane ali oštevilčene ravni težavnosti, ne le splošnega prilagajanja.","Podprimo učiteljeve ravni, kadar so koristne, vendar naj ne bodo obvezne."],"de":["Benannte Schwierigkeitsstufen","Der Prompt enthält benannte/nummerierte Schwierigkeitsstufen statt nur allgemeiner Anpassung.","Lehrkraftdefinierte Stufen bei Bedarf unterstützen, aber nicht verpflichtend machen."]},"criteria":{"en":["Dedicated success criteria / rubric","Success criteria, rubric or comparable evidence standard is explicitly provided/requested.","Make learning evidence explicit and connect feedback to it."],"sl":["Namenski kriteriji uspeha / rubrika","Kriteriji uspeha, rubrika ali primerljiv standard dokazov so izrecno podani ali zahtevani.","Dokaze učenja naredimo eksplicitne in nanje navežemo povratne informacije."],"de":["Explizite Erfolgskriterien / Rubrik","Erfolgskriterien, Rubrik oder vergleichbarer Nachweisstandard wird ausdrücklich bereitgestellt/abgefragt.","Lernnachweise explizit machen und Feedback daran binden."]},"closure":{"en":["A trigger for closure","A specific condition, command or sequence endpoint tells the assistant when to stop/close.","Separate stopping conditions from evidence of learning."],"sl":["Sprožilec za zaključek","Določen pogoj, ukaz ali konec zaporedja pove asistentu, kdaj naj zaključi.","Pogoj za zaključek ločimo od dokaza učenja."],"de":["Auslöser für den Abschluss","Eine konkrete Bedingung, ein Befehl oder Sequenzende sagt dem Assistenten, wann er beendet.","Abschlussbedingung von Lernnachweisen trennen."]},"reflection":{"en":["Explicit learning reflection","Learner reflection is instructed or offered as a closing option.","Keep reflection distinct from independent performance evidence."],"sl":["Izrecna učna refleksija","Refleksija učenca je zahtevana ali ponujena kot možnost zaključka.","Refleksijo ločimo od dokaza samostojne izvedbe."],"de":["Explizite Lernreflexion","Lernreflexion wird angewiesen oder als Abschlussoption angeboten.","Reflexion von unabhängigem Leistungsnachweis trennen."]},"deliberate_error":{"en":["Deliberate AI errors","The assistant is asked to intentionally make errors or give a flawed teach-back.","Keep optional and pair with an explicit correction/debrief route."],"sl":["Namerno napačni odgovori AI","Asistent naj namerno naredi napako ali poda pomanjkljivo razlago za povratno poučevanje.","Naj ostane neobvezno in povezano z jasnim popravljanjem/debriefingom."],"de":["Absichtliche KI-Fehler","Der Assistent soll absichtlich Fehler machen oder einen fehlerhaften Teach-back geben.","Optional halten und mit klarer Korrektur/Nachbereitung koppeln."]},"uncertainty":{"en":["Missing-information / uncertainty instruction","The prompt tells the assistant to disclose insufficient information or seek support when evaluation is unreliable.","Retain an honesty and clarification rule in every generated prompt."],"sl":["Navodilo ob manjkajočih informacijah / negotovosti","Prompt asistentu naroči, naj pove, ko informacij ni dovolj, ali poišče pomoč, kadar presoja ni zanesljiva.","V vsakem generiranem promptu ohranimo pravilo iskrenosti in pojasnitve."],"de":["Regel für fehlende Information / Unsicherheit","Der Prompt verlangt, unzureichende Information offenzulegen oder Unterstützung zu suchen, wenn Bewertung unzuverlässig ist.","In jedem erzeugten Prompt eine Ehrlichkeits- und Klärungsregel beibehalten."]},"privacy":{"en":["Personal-data minimisation instruction","The prompt explicitly avoids requesting unnecessary personal information.","Include this baseline regardless of frequency in the examples."],"sl":["Navodilo za zmanjšanje osebnih podatkov","Prompt izrecno prepove zahtevanje nepotrebnih osebnih podatkov.","To varovalo vključimo ne glede na pogostost v primerih."],"de":["Regel zur Datenminimierung","Der Prompt vermeidet ausdrücklich unnötige personenbezogene Angaben.","Diese Grundregel unabhängig von ihrer Häufigkeit in den Beispielen aufnehmen."]},"independent":{"en":["Explicitly unaided final check","A fresh final/transfer check explicitly withholds content hints or answers.","Add a configurable independent check and label assisted evidence honestly."],"sl":["Izrecno samostojen zaključni preizkus","Nov zaključni ali transferni preizkus izrecno poteka brez vsebinskih namigov ali odgovorov.","Dodamo nastavljiv samostojen preizkus in pošteno označimo delo s pomočjo."],"de":["Explizit unabhängiger Abschlusscheck","Ein neuer Abschluss-/Transfercheck verzichtet ausdrücklich auf inhaltliche Hinweise oder Antworten.","Einen konfigurierbaren unabhängigen Check ergänzen und unterstützte Leistung ehrlich kennzeichnen."]}},"CASE_ROLE":{"E1":{"en":"Scenario adviser","sl":"Svetovalec v scenariju","de":"Berater in einem Szenario"},"E2":{"en":"Teachable peer","sl":"Učljivi vrstnik","de":"Lernender Peer"},"E3":{"en":"Critical friend","sl":"Kritični prijatelj","de":"Kritischer Freund"},"E4":{"en":"Socratic tutor","sl":"Sokratski tutor","de":"Sokratischer Tutor"},"E5":{"en":"Tutor / formative feedback","sl":"Tutor / formativna povratna informacija","de":"Tutor / formatives Feedback"},"E6":{"en":"Curious learner","sl":"Radovedni učenec","de":"Neugieriger Lernender"},"E7":{"en":"Guided tutor","sl":"Vodilni tutor","de":"Geführter Tutor"},"E8":{"en":"Argumentation tutor","sl":"Tutor za argumentacijo","de":"Argumentationstutor"}},"SUG":{"en":{"role":[["Guided tutor","Act as a guided tutor who asks focused questions and gives support without taking over the learner’s reasoning."],["Teachable peer","Act as a curious learner / teachable peer. Ask the human to explain, clarify and justify the topic instead of explaining it yourself."],["Critical friend","Act as a constructive critical friend. Give feedback on the learner’s own work without writing a replacement answer for them."],["Discussion partner","Act as a discussion or role-play partner who challenges ideas and asks for justification while keeping the learner responsible for the final decision."]],"activity":[["Explain + apply","Explain the concept in their own words, respond to follow-up questions and apply it to a new example."],["Solve + justify","Solve one problem at a time, explain the reasoning behind each step and revise the solution after feedback."],["Revise own work","Submit their own draft, respond to feedback and revise it while keeping ownership of the final version."]],"help":[["Hints → explanation","Use questions and hints first. If the learner still cannot progress, give a brief explanation and then ask for a fresh attempt."],["Hints only","Use questions and hints only. If the learner still cannot progress, stop the item and recommend teacher support."],["Brief explanations","Give brief explanations when useful, then return the task to the learner and ask for a fresh application."]]},"sl":{"role":[["Vodilni tutor","Deluj kot vodilni tutor, ki postavlja ciljno usmerjena vprašanja in pomaga, ne da bi prevzel učenčevo razmišljanje."],["Učljivi vrstnik","Deluj kot radovedni učenec oziroma učljivi vrstnik. Človeka prosi, naj temo razloži, pojasni in utemelji, namesto da jo razlagaš sam."],["Kritični prijatelj","Deluj kot konstruktivni kritični prijatelj. Podaj povratne informacije o učenčevem delu, ne da bi namesto njega napisal nadomestni odgovor."],["Diskusijski partner","Deluj kot partner v razpravi ali igri vlog, ki izziva ideje in zahteva utemeljitev, končna odločitev pa ostane pri učencu."]],"activity":[["Razloži + uporabi","Pojasni koncept z lastnimi besedami, odgovori na podvprašanja in znanje uporabi pri novem primeru."],["Reši + utemelji","Rešuj po eno nalogo, razloži razmišljanje pri vsakem koraku in po povratni informaciji popravi rešitev."],["Popravi svoje delo","Oddaj svoj osnutek, odgovori na povratne informacije in ga popravi, pri čemer ohrani avtorstvo končne različice."]],"help":[["Namigi → razlaga","Najprej uporabi vprašanja in namige. Če učenec še vedno ne more napredovati, podaj kratko razlago in nato zahtevaj nov poskus."],["Samo namigi","Uporabljaj samo vprašanja in namige. Če učenec še vedno ne more napredovati, ustavi nalogo in predlagaj pomoč učitelja."],["Kratke razlage","Po potrebi podaj kratko razlago, nato nalogo vrni učencu in ga prosi za novo uporabo znanja."]]},"de":{"role":[["Geführter Tutor","Handle als geführter Tutor, der gezielte Fragen stellt und unterstützt, ohne das Denken der Lernenden zu übernehmen."],["Lernender Peer","Handle als neugieriger Lernender bzw. lernender Peer. Bitte die Person, das Thema zu erklären, zu klären und zu begründen, statt es selbst zu erklären."],["Kritischer Freund","Handle als konstruktiver kritischer Freund. Gib Feedback zur eigenen Arbeit der Lernenden, ohne eine Ersatzantwort zu verfassen."],["Diskussionspartner","Handle als Diskussions- oder Rollenspielpartner, der Ideen herausfordert und Begründungen verlangt, während die endgültige Entscheidung bei den Lernenden bleibt."]],"activity":[["Erklären + anwenden","Das Konzept in eigenen Worten erklären, Rückfragen beantworten und es auf ein neues Beispiel anwenden."],["Lösen + begründen","Jeweils eine Aufgabe lösen, jeden Schritt begründen und die Lösung nach Feedback überarbeiten."],["Eigene Arbeit überarbeiten","Einen eigenen Entwurf einreichen, auf Feedback reagieren und ihn überarbeiten, wobei die Endfassung Eigentätigkeit bleibt."]],"help":[["Hinweise → Erklärung","Zuerst Fragen und Hinweise verwenden. Wenn kein Fortschritt möglich ist, kurz erklären und danach einen neuen Versuch verlangen."],["Nur Hinweise","Nur Fragen und Hinweise verwenden. Wenn weiterhin kein Fortschritt möglich ist, die Aufgabe stoppen und Unterstützung durch die Lehrkraft empfehlen."],["Kurze Erklärungen","Bei Bedarf kurz erklären, dann die Aufgabe an die Lernenden zurückgeben und eine neue Anwendung verlangen."]]}},"PH":{"en":{"topic":"e.g. subject and topic","learners":"e.g. age/grade, course or learner group","goal":"By the end, learners should be able to...","criteria":"One criterion per line","role":"Describe the role in your own words","activity":"What will learners explain, solve, create, justify, revise or teach?","ownership":"Describe the part that AI must not do for the learner.","help":"Describe when to ask, hint, explain or hand off.","context":"Add any local rules, definitions, source text, task constraints or other important context.","prior":"What should learners already know?","mis":"Anything learners commonly misunderstand? Add a suggested response if useful.","struggle":"What support move should happen next?","progress":"How should support be reduced or the task extended?","taskbank":"Optional: paste levels, tasks or progression rules.","checkTask":"Optional: a fresh problem, explanation, revision or application linked to the criteria.","ending":"Describe the stopping condition and closing output.","style":"e.g. concise, encouraging, age-appropriate"},"sl":{"topic":"npr. predmet in tema","learners":"npr. starost/razred, predmet ali skupina učencev","goal":"Ob koncu naj bodo učenci sposobni ...","criteria":"En kriterij v vsako vrstico","role":"Opišite vlogo s svojimi besedami","activity":"Kaj bodo učenci razlagali, reševali, ustvarjali, utemeljevali, popravljali ali poučevali?","ownership":"Opišite del, ki ga AI ne sme narediti namesto učenca.","help":"Opišite, kdaj naj AI vpraša, namigne, razloži ali preda učitelju.","context":"Dodajte lokalna pravila, definicije, besedilo vira, omejitve naloge ali drug pomemben kontekst.","prior":"Kaj naj učenci že znajo?","mis":"Kaj učenci pogosto napačno razumejo? Po želji dodajte ustrezen odziv.","struggle":"Kateri podporni korak naj sledi?","progress":"Kako naj se pomoč zmanjša ali naloga nadgradi?","taskbank":"Neobvezno: prilepite ravni, naloge ali pravila napredovanja.","checkTask":"Neobvezno: nova naloga, razlaga, popravek ali uporaba, povezana s kriteriji.","ending":"Opišite pogoj za zaključek in končni izhod.","style":"npr. kratko, spodbudno, primerno starosti"},"de":{"topic":"z. B. Fach und Thema","learners":"z. B. Alter/Klasse, Kurs oder Lerngruppe","goal":"Am Ende sollen die Lernenden in der Lage sein ...","criteria":"Ein Kriterium pro Zeile","role":"Beschreiben Sie die Rolle in eigenen Worten","activity":"Was sollen die Lernenden erklären, lösen, erstellen, begründen, überarbeiten oder lehren?","ownership":"Beschreiben Sie den Teil, den die KI nicht für die Lernenden übernehmen darf.","help":"Beschreiben Sie, wann die KI fragen, Hinweise geben, erklären oder übergeben soll.","context":"Lokale Regeln, Definitionen, Quellentexte, Aufgabenbedingungen oder anderen wichtigen Kontext ergänzen.","prior":"Was sollten die Lernenden bereits wissen?","mis":"Was wird häufig missverstanden? Optional eine passende Reaktion ergänzen.","struggle":"Welche Unterstützungsmaßnahme soll als Nächstes erfolgen?","progress":"Wie soll Unterstützung reduziert oder die Aufgabe erweitert werden?","taskbank":"Optional: Stufen, Aufgaben oder Progressionsregeln einfügen.","checkTask":"Optional: neue Aufgabe, Erklärung, Überarbeitung oder Anwendung passend zu den Kriterien.","ending":"Abschlussbedingung und gewünschtes Abschlussformat beschreiben.","style":"z. B. knapp, ermutigend, altersgerecht"}}};
