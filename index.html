ng objective:\\*\\* Find arguments, refute opposing arguments, and find examples that support the arguments.\n 4. \\*\\*Teaching approach:\\*\\* Constructively question the student’s arguments, ask for explanations and examples, and introduce counterarguments.\n 5. \\*\\*Socratic approach:\\*\\* Use follow-up questions to help students refine and strengthen their arguments.\n 6. \\*\\*Explanation style:\\*\\* Use simple language, short sections, examples, and analogies.\n 7. \\*\\*Handling mistakes:\\*\\* Explain mistakes clearly and specifically without being judgmental.\n 8. \\*\\*Adaptive difficulty:\\*\\* Adjust the level of difficulty to the student’s responses and progress.\n 9. \\*\\*Exercises:\\*\\* After each exercise, briefly review what the student learned from it.\n 10. \\*\\*Feedback:\\*\\* Clearly state what was done well and what could still be improved.\n 11. \\*\\*Learning assessment:\\*\\* At the end, ask questions that encourage students to reflect on their learning progress."};

function independentPolicy(d,lang,manual=false){
 const l=LABELS[lang],p=POLICY[lang];
 if(manual)return l.check+': '+l.ph.checkMode+'\n'+l.checkTask+': '+l.ph.checkTask+'\n'+p.phase+'\n'+l.conditionalNone;
 if(d.checkMode==='yes')return l.checkYes+': '+(d.checkTask||l.defaultCheck)+'\n'+p.phase;
 if(d.checkMode==='teacher')return l.later+': '+(d.checkTask||l.defaultCheck)+'\n'+l.none;
 return l.none;
}
function compileDimensionTexts(d,lang,manual=false){
 const l=LABELS[lang],p=POLICY[lang];
 const get=(k,def='')=>manual?l.ph[k]:(d[k]||def);
 const line=(k,text)=>l[k]+': '+text;
 const prior=get('prior',l.defaultPrior),own=get('ownership',d.activity||'');
 let context=line('context',get('context',l.noContext));
 if(manual)context+='\n'+line('files',l.ph.files);
 else if(selectedFiles.length)context+='\n'+l.files+':\n'+selectedFiles.map(n=>'- '+l.file+': '+JSON.stringify(n)).join('\n');
 const end=get('ending',d.checkMode==='yes'?l.defaultEndYes:d.checkMode==='teacher'?l.defaultEndTeacher:l.defaultEndNone);
 const body=[
 [line('topic',get('topic')),line('learners',get('learners')),line('prior',prior),line('language',get('language','English')),line('style',get('style',l.defaultStyle))].join('\n'),
 [line('goal',get('goal')),l.criteria+':\n'+numbered(get('criteria')),p.evidence].join('\n'),
 [line('role',get('role')),line('ownership',own),p.role].join('\n'),
 [line('activity',get('activity')),line('help',get('help',l.defaultHelp)),p.dialogue].join('\n'),
 [line('struggle',get('struggle',l.defaultStruggle)),line('progress',get('progress',l.defaultProgress)),line('stillStuck',supportPolicy(d,lang,manual)),p.adaptation,p.misconceptions,
 (manual||d.misconceptions)?line('knownMis',get('misconceptions')):'',
 (manual||d.taskbank)?line('tasks',get('taskbank')):''].filter(Boolean).join('\n'),
 [context,p.context].join('\n'),
 [line('ending',end),independentPolicy(d,lang,manual),l.exit,
 (!manual&&d.replyLimit)?l.replyPrefix+' '+d.replyLimit+' '+l.replySuffix:'',p.closing].filter(Boolean).join('\n')
 ];
 return body.map((b,i)=>DIM_TXT[lang][i][0]+'\n'+b);
}
function compileAdaptTexts(d,lang,manual=false){
 const dims=compileDimensionTexts(d,lang,manual);
 return GUIDE_DIMS.map((indices,i)=>{
  const head=ADAPT_TXT[lang][i][0]+' - '+ADAPT_TXT[lang][i][1];
  return head+'\n\n'+indices.map(j=>dims[j]).join('\n\n');
 });
}
function manualPart(index,lang=uiLang){
 return compileAdaptTexts({},lang,true)[index];
}
function manualTemplate(lang=uiLang){return [
 'ADAPT | '+LABELS[lang].subtitle,
 GUIDE[lang].policyHead+'\n'+policyRules(lang),
 ...GUIDE_DIMS.map((_,i)=>manualPart(i,lang))
].join('\n\n');}

let templatePayload='',templateFileName='ADAPT_prompt_template.txt';
function showTemplate(text=manualTemplate(),part=null){
 const g=GUIDE[uiLang];templatePayload=text;
 templateFileName='ADAPT_'+(part===null?'prompt_template':('part_'+(part+1)))+'_'+uiLang+'.txt';
 $('templateTitle').textContent=part===null?g.templateTitle:ADAPT_TXT[uiLang][part][1];
 $('templateHint').textContent=part===null?g.templateHint:g.partHint;

 $('templateCopy').textContent=g.copyFull;
 if(part!==null)$('templateCopy').textContent=g.copyPart;
 $('templateSave').textContent=g.download;$('templateClose').textContent=tr('close');$('templateStatus').textContent='';
 if(!$('templateDialog').open)$('templateDialog').showModal();

async function copyGuide(text,statusId,part=null){
 try{
  if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('Clipboard not available');
  await navigator.clipboard.writeText(text);
  $(statusId).textContent=guideText('copied');
 }catch(error){
  if(!$('templateDialog').open)showTemplate(text,part);
  $('templateText').focus();$('templateText').select();
  let ok=false;try{ok=document.execCommand('copy');}catch(ignore){}
  $('templateStatus').textContent=guideText(ok?'copied':'selected');
 }
}
function saveGuideText(text,filename){const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function initialiseGuide(){
 document.querySelectorAll('.tab').forEach((b,i)=>{
  b.setAttribute('aria-controls','p'+(i+1));$('p'+(i+1)).setAttribute('aria-labelledby',b.id);
  b.addEventListener('keydown',e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%3;else if(e.key==='ArrowLeft')n=(i+2)%3;else if(e.key==='Home')n=0;else if(e.key==='End')n=2;else return;e.preventDefault();show(n+1);$('tab'+(n+1)).focus();});
 });
}
